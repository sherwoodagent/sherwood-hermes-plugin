manifest_version: 2
name: sherwood-monitor
version: "0.7.0"
description: >-
  Bridges Sherwood fund events (on-chain + XMTP) into Hermes, and runs a
  group-chat fund: your Hermes pitches trades in a Telegram group, members
  deposit and object, guest Hermes agents join as co-managers. Slash commands:
  /fund, /join-fund, /fund-approve, /fund-agents, /leaderboard.
author: Sherwood
license: MIT
homepage: https://sherwood.sh
# Hermes loads the root __init__.py (it re-exports sherwood_monitor.register);
# there is no `entry:` manifest field.
# 0.21.5 is the first release whose installer accepts manifest v2 (it reads the
# runtime's SUPPORTED_MANIFEST_VERSION = 2) and knows `requires_hermes`.
requires_hermes: ">=0.21.5"
# Mirrors pyproject [project].dependencies. python-telegram-bot is NOT listed:
# it comes with Hermes' own Telegram extra, and every PTB import is guarded.
python_dependencies:
  - "PyYAML>=6.0,<7"
  - "eth-keys>=0.5,<1"
  - "eth-utils>=4.0,<7"
  - "eth-hash[pycryptodome]>=0.5,<1"
requires_env:
  - name: TELEGRAM_BOT_TOKEN
    description: Bot token for the fund's Telegram group (from @BotFather)
    url: https://core.telegram.org/bots/features#botfather
    secret: true
  # No Privy keys: members' and the host's wallets live in the web app
  # (app.sherwood.sh); this plugin never holds a wallet credential.
  - name: SHERWOOD_TG_LINK_SECRET
    description: Shared HMAC secret that signs the bot's personal /tg links (the app verifies it)
    url: https://docs.sherwood.sh
    secret: true
  - name: SHERWOOD_TG_API_TOKEN
    description: Bearer token for the app's /api/tg/link member-wallet lookup (separate from the link-signing secret)
    url: https://docs.sherwood.sh
    secret: true
  - name: TX_BUILDER_URL
    description: Prepare API base URL (unsigned transactions); defaults to https://api.sherwood.sh/api/v1
    url: https://docs.sherwood.sh
    secret: false
  - name: APP_BASE_URL
    description: Sherwood app base URL for the /tg links on card buttons; defaults to https://app.sherwood.sh
    url: https://app.sherwood.sh
    secret: false
config_schema:
  agent_name:
    type: str
    default: ""
    description: This Hermes's agent name inside funds (unique per fund)
  agent_identity_id:
    type: str
    default: ""
    description: This agent's ERC-8004 identity token id
  agent_address:
    type: str
    default: ""
    description: This agent's own scoped wallet address (it bonds its own WOOD)
  owner_telegram_id:
    type: str
    default: ""
    description: Telegram user id of the human who runs this Hermes
  default_fund:
    type: str
    default: ""
    description: Fund subdomain to use when a command or tool does not name one
  tx_builder_url:
    type: str
    default: https://api.sherwood.sh/api/v1
    description: Prepare API base URL
  app_base_url:
    type: str
    default: https://app.sherwood.sh
    description: Sherwood app base URL for the /tg links on card buttons
  app_link_hosts:
    type: str
    default: app.sherwood.sh
    description: Comma-separated hosts the member-wallet lookup may call (https only)
  proposal_signer:
    type: str
    default: host
    choices: [host, agent]
    description: >-
      Who signs propose: `host` (pre-GA beta, ownerOnlyProposals, the host co-signs
      the agent's draft) or `agent` (open protocol, the agent proposes itself)
  fund_state_backend:
    type: str
    default: local
    choices: [local, http]
    description: Where shared fund state lives (local JSON file, or the hosted fund-state API)
  fund_state_dir:
    type: str
    default: ""
    description: Local fund state directory (default ~/.hermes/plugins/sherwood-monitor/funds)
  fund_state_url:
    type: str
    default: ""
    description: Hosted fund-state API base URL (http backend)
provides_tools:
  - sherwood_monitor_start
  - sherwood_monitor_stop
  - sherwood_monitor_status
  - sherwood_monitor_exposure
  - sherwood_monitor_cron_tick
  - fund_status
  - fund_setup
  - fund_claim_topic
  - fund_release_claim
  - fund_draft_proposal
  - fund_set_proposal_status
  - fund_record_vote
  - fund_record_settle
  - fund_approve_member
  - fund_approve_agent
  - fund_remove_agent
provides_hooks:
  - on_session_start
  - on_session_end
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
