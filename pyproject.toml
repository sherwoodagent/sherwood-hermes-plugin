[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherwood-monitor"
version = "0.8.2"
description = "Hermes plugin for Sherwood fund monitoring and auto-response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherwood" }]
# Upper bounds per the Hermes catalog dependency policy; plugin.yaml
# python_dependencies mirrors this list.
dependencies = [
    "PyYAML>=6.0,<7",
    "eth-keys>=0.5,<1",
    "eth-utils>=4.0,<7",
    "eth-hash[pycryptodome]>=0.5,<1",
]

[project.optional-dependencies]
# python-telegram-bot is deliberately NOT a runtime dependency: Hermes' own
# Telegram extra provides it (python-telegram-bot[webhooks]==22.8) and every
# PTB import here is guarded. Tests and scripts/telegram_smoke.py use it.
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-mock>=3.12,<4",
    "python-telegram-bot[job-queue]>=22,<23",
]

[project.entry-points."hermes_agent.plugins"]
sherwood-monitor = "sherwood_monitor"

[project.scripts]
sherwood-monitor-watchdog = "sherwood_monitor.cli_watchdog:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sherwood_monitor*"]
exclude = ["xmtp_sidecar*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
