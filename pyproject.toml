[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherwood-monitor"
version = "0.6.0"
description = "Hermes plugin for Sherwood fund monitoring and auto-response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sherwood" }]
dependencies = [
    "PyYAML>=6.0",
    "eth-keys>=0.5",
    "eth-utils>=4.0",
    "eth-hash[pycryptodome]>=0.5",
]

[project.optional-dependencies]
# Telegram group-fund cards (Hermes' Telegram gateway already ships PTB; this
# extra is for the smoke script and standalone use).
telegram = [
    "python-telegram-bot[job-queue]>=21,<23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "python-telegram-bot[job-queue]>=21,<23",
]

[project.entry-points."hermes_agent.plugins"]
sherwood-monitor = "sherwood_monitor"

[project.scripts]
sherwood-monitor-watchdog = "sherwood_monitor.cli_watchdog:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sherwood_monitor*"]
exclude = ["xmtp_sidecar*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
